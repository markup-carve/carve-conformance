name: Compatibility
# Pull requests reach this lane through site.yml, which runs it only when it changed.
on:
  workflow_call:
    outputs:
      site_ready:
        description: The compatibility site was built and uploaded as the compat-site artifact
        value: ${{ jobs.measure.outputs.site_ready }}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: compat
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      site_ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - name: Restore node modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: compat/node_modules
          key: compat-node-modules-v1-${{ runner.os }}-${{ hashFiles('.nvmrc', 'compat/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Unit and JavaScript compatibility tests
        run: npm test
      - name: Provision native readers
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml cmark libmd4c-dev libmd4c-html0-dev
          python -m pip install -r scripts/compat/requirements.txt
          mkdir -p .cache/compat reports
          cc -std=c99 -Wall -Wextra -Werror \
            "-DCARVE_MD4C_VERSION=\"$(dpkg-query -W -f='${Version}' libmd4c0)\"" \
            scripts/compat/md4c-driver.c -lmd4c -lmd4c-html \
            -o .cache/compat/md4c-driver
      - name: Identify Rust toolchain
        id: toolchain
        run: echo "rust=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # A pin bump restores the previous build: the provisioner moves the checkouts
      # and cargo rebuilds only what changed.
      - name: Restore pinned engines
        uses: actions/cache@v4
        with:
          path: |
            compat/.cache/engines
            compat/.cache/cargo-target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: compat-engines-v1-${{ runner.os }}-rust-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('compat/resources/engines.json', 'compat/scripts/provision-engines.mjs') }}
          restore-keys: compat-engines-v1-${{ runner.os }}-rust-${{ steps.toolchain.outputs.rust }}-
      - name: Provision pinned Carve engines and Pandoc
        run: npm run compat:provision
      - name: Measure nine targets across three Carve engines
        id: comparison
        continue-on-error: true
        env:
          CARVE_COMPAT_PYTHON: python
          CARVE_PANDOC: .cache/pandoc/bin/pandoc
        run: npm run compat:check -- --report=reports/latest.json
      - name: Measure CommonMark spec examples (measurement, no gate)
        env:
          CARVE_PANDOC: .cache/pandoc/bin/pandoc
        run: npm run compat:commonmark -- --report=reports/commonmark.json
      - name: Measure djot.js test examples (measurement, no gate)
        run: npm run compat:djot -- --report=reports/djot.json
      - name: Build report website
        id: site
        run: |
          npm run site:build
      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('compat/package-lock.json') }}
      # No --with-deps: the runner image already carries Chrome's system libraries, and apt cost 20s to 3 minutes.
      - run: npx playwright install chromium
      - name: Browser checks
        run: npm run test:site
      - name: Save full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: |
            compat/reports/latest.json
            compat/reports/commonmark.json
            compat/reports/djot.json
            compat/test-results/
          if-no-files-found: warn
      - name: Save website
        uses: actions/upload-artifact@v4
        with:
          name: compat-site
          path: compat/dist
      - name: Mark packaged website ready
        id: ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Fail the check when a comparison fails
        if: steps.comparison.outcome == 'failure'
        run: exit 1
