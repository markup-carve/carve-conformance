name: Cross-reader evidence
on:
  workflow_dispatch:
  push:
    branches: ['evidence/**']
    paths:
      - '.github/workflows/cross-reader-evidence.yml'
      - 'proofs/package.json'
      - 'proofs/package-lock.json'
      - 'proofs/scripts/comparison/adapters.mjs'
      - 'proofs/scripts/properties/scaling-cases.mjs'
      - 'proofs/scripts/properties/benchmark-results.mjs'
      - 'proofs/scripts/evidence-environment.mjs'
      - 'proofs/scripts/spec-pins.mjs'
      - 'proofs/scripts/comparison/bench.mjs'
      - 'proofs/scripts/comparison/worker.mjs'
      - 'proofs/scripts/comparison/environment.mjs'
      - 'proofs/scripts/comparison/controls.mjs'
      - 'proofs/scripts/comparison/scaling-cases.mjs'
      - 'proofs/scripts/comparison/measurement-host.mjs'
      - 'proofs/scripts/comparison/settle-host.mjs'
      - 'proofs/scripts/profiling/current-costs.mjs'
      - 'proofs/scripts/profiling/cost-worker.mjs'
      - 'proofs/scripts/profiling/run.mjs'
      - 'proofs/scripts/profiling/worker.mjs'
      - 'proofs/scripts/profiling/instrument.mjs'
      - 'proofs/scripts/profiling/summary.mjs'

permissions:
  contents: read
concurrency:
  group: cross-reader-evidence-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: proofs
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARVE_CONTROLLED_BENCHMARK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: proofs/package-lock.json
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - run: npm ci --no-audit --no-fund
      - name: Check shared-syntax controls
        run: node --input-type=module -e "import {checkControls} from './scripts/comparison/controls.mjs'; console.log(checkControls().length + ' controls passed')"
      - name: Wait for dependency installation load to settle
        run: node scripts/comparison/settle-host.mjs
      - name: Measure paired cross-reader scaling
        run: npm run bench:comparison
      - name: Measure positions, allocation and direct-HTML attempts
        run: npm run profile:costs
      - name: Refresh nesting instrumentation
        run: npm run profile:nesting
      - name: Regenerate reports
        run: |
          npm run report:comparison
          npm run report:costs
          npm run report:profiling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-reader-evidence
          path: |
            proofs/reports/comparison-timings.json
            proofs/reports/comparison-timings.json.partial
            proofs/reports/comparison.md
            proofs/reports/current-costs.json
            proofs/reports/current-costs.json.partial
            proofs/reports/current-costs.md
            proofs/reports/nesting-profile.json
            proofs/reports/nesting-profile.json.partial
            proofs/reports/nesting-profile.md
          if-no-files-found: error
