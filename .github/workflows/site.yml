name: Website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The single pull request entry point: each lane runs once, and only when it changed.
  # A site change needs both lane sites to assemble, so it runs both lanes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proofs: ${{ steps.lanes.outputs.proofs }}
      compat: ${{ steps.lanes.outputs.compat }}
      site: ${{ steps.lanes.outputs.site }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: lanes
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'proofs=true\ncompat=true\nsite=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf '%s\n' "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          all=$(has '^(\.nvmrc|\.gitmodules)$')
          site=$(has '^(site/|scripts/|tests/|package(-lock)?\.json$|playwright\.config\.mjs$|\.github/workflows/site\.yml$)')
          [ "$all" = true ] && site=true
          proofs=$(has '^(proofs/|\.github/workflows/proofs\.yml$)')
          compat=$(has '^(compat/|\.github/workflows/compat\.yml$)')
          [ "$site" = true ] && proofs=true && compat=true
          printf 'proofs=%s\ncompat=%s\nsite=%s\n' "$proofs" "$compat" "$site" | tee -a "$GITHUB_OUTPUT"
  proofs:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    uses: ./.github/workflows/proofs.yml
  compat:
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    uses: ./.github/workflows/compat.yml
  assemble:
    # Proofs gate the deploy. A failed compatibility comparison still publishes,
    # because the report is how that failure is read.
    needs: [changes, proofs, compat]
    if: always() && needs.changes.outputs.site == 'true' && needs.proofs.result == 'success' && needs.compat.outputs.site_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: proofs-site
          path: proofs/_site
      - uses: actions/download-artifact@v4
        with:
          name: compat-site
          path: compat/dist
      - run: node scripts/build-site.mjs
      - name: Restore node modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: site-node-modules-v1-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Firefox and WebKit require additional system libraries.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: assemble
    if: always() && needs.assemble.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
