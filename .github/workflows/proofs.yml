name: Proofs

# Pull requests reach this lane through site.yml, which runs it only when it changed.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run timing benchmarks and upload raw measurements
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: proofs

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OCAML_COMPILER: '4.14.2'
      ROCQ_CORE: '9.2.0'
      ROCQ_STDLIB: '9.1.0'
      DUNE: '3.23.1'
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: proofs/package-lock.json
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
      - name: Identify opam version
        id: opam
        run: echo "version=$(opam --version)" >> "$GITHUB_OUTPUT"
      - name: Restore proof toolchain
        id: proof-toolchain
        uses: actions/cache/restore@v4
        with:
          path: _opam
          # Keyed on the pins alone: hashing the whole workflow made every unrelated edit rebuild Rocq.
          key: proof-toolchain-v2-ubuntu-24.04-${{ runner.arch }}-ocaml-${{ env.OCAML_COMPILER }}-opam-${{ steps.opam.outputs.version }}-rocq-${{ env.ROCQ_CORE }}-stdlib-${{ env.ROCQ_STDLIB }}-dune-${{ env.DUNE }}
      - name: Install proof compiler and standard library
        working-directory: .
        run: opam install --yes "rocq-core.$ROCQ_CORE" "rocq-stdlib.$ROCQ_STDLIB" "dune.$DUNE"
      - name: Save proof toolchain
        if: steps.proof-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: ${{ steps.proof-toolchain.outputs.cache-primary-key }}
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - name: Restore node modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: proofs/node_modules
          key: proofs-node-modules-v1-${{ runner.os }}-${{ hashFiles('.nvmrc', 'proofs/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Check deterministic scaling work
        run: |
          npm run check:scaling-guards
          npm run check:budgets
      - name: Record property observations
        run: npm run check:properties -- --check-artifact reports/property-results.json --output reports/property-ci.json
      - name: Check three-reader comparison
        run: npm run check:comparison -- --check reports/comparison-results.json --output reports/comparison-ci.json
      - name: Check scoped contracts and container positions
        run: |
          npm run check:contracts -- --check reports/comparison-contracts.json
          npm run check:containers -- --check reports/container-regressions.json
      # dune's shared cache skips Rocq files whose sources and toolchain are unchanged.
      - name: Restore dune cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: proofs-dune-v1-rocq-${{ env.ROCQ_CORE }}-${{ github.sha }}
          restore-keys: proofs-dune-v1-rocq-${{ env.ROCQ_CORE }}-
      - name: Check pinned djot.v package
        run: |
          npm run build:djot-v
          npm run check:djot-v -- --check reports/djot-v-results.json
          npm run check:djot-extensions -- --check reports/djot-extension-results.json
          npm run proof:djot-extensions -- --check reports/djot-extension-proofs.json
          npm run build:djot-differential
          npm run check:djot-differential -- --check reports/djot-differential.json --diagnostic-output reports/djot-differential-ci.json
          npm run triage:djot-differences -- --check reports/djot-difference-triage.json
          npm run proof:djot-differential -- --check reports/djot-differential-proofs.json
          npm run report:djot-differential
          git diff --exit-code -- reports/djot-differential.md
          npm run report:djot-v
          git diff --exit-code -- reports/djot-v.md
      - name: Check comparison and profiling reports
        run: |
          npm run report:comparison
          npm run report:profiling
          npm run report:budgets
          git diff --exit-code -- reports/comparison.md reports/nesting-profile.md reports/regression-budgets.md reports/regression-budgets.csv
      - name: Check committed report
        run: |
          npm run report:properties
          git diff --exit-code -- reports/properties.md
      - name: Check model proofs and recorded evidence
        working-directory: .
        run: opam exec -- npm --prefix proofs run proof:layout
      - name: Check candidate-stack selection and extracted helper
        working-directory: .
        run: opam exec -- npm --prefix proofs run proof:stack
      - name: Measure parser scaling
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: npm run bench:scaling -- reports/scaling-ci.json
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-observations
          path: |
            proofs/reports/property-ci.json
            proofs/reports/comparison-ci.json
            proofs/reports/djot-differential-ci.json
      - name: Upload benchmark measurements
        if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: scaling-measurements
          path: proofs/reports/scaling-ci.json
          if-no-files-found: error

  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/proofs/.cache/ownership-target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: proofs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      # The runner image ships PHP; apt only runs when mbstring is missing.
      - name: Install PHP
        run: php -m | grep -qx mbstring || { sudo apt-get update && sudo apt-get install -y php-cli php-mbstring; }
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      # build.mjs reuses a checkout already at its pin, and cargo rebuilds only what a pin bump changed.
      - name: Restore pinned readers
        uses: actions/cache@v4
        with:
          path: |
            proofs/.cache/ownership
            proofs/.cache/ownership-current
            proofs/.cache/ownership-target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: proofs-readers-v1-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('proofs/scripts/ownership/pins.json', 'proofs/scripts/ownership/current-pins.json', 'proofs/scripts/ownership/build.mjs') }}
          restore-keys: proofs-readers-v1-rust-${{ steps.rust.outputs.cachekey }}-
      - name: Restore node modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: proofs/node_modules
          key: proofs-node-modules-v1-noscripts-${{ runner.os }}-${{ hashFiles('.nvmrc', 'proofs/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:ownership
      - name: Check current ownership and versioned contracts
        run: |
          npm run build:ownership:current
          npm run check:ownership:current
          npm run check:ownership:contracts
          npm run report:ownership:current
      - run: npm run check:ownership -- --check reports/ownership-results.json
      - run: npm run reduce:ownership -- --check reports/ownership-reductions.json
      - run: node --test tests/ownership.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-build
          path: |
            proofs/.cache/ownership/build.json
            proofs/.cache/ownership-current/build.json
          include-hidden-files: true

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: .cache/runtime/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mbstring
      - uses: actions/cache@v4
        with:
          path: proofs/.cache/runtime/target
          key: runtime-rust-${{ runner.os }}-${{ hashFiles('proofs/scripts/runtime/rust/Cargo.lock', 'proofs/scripts/runtime/rust/Cargo.toml', 'proofs/scripts/ownership/pins.json') }}
      - run: npm run build:runtime
      - run: node --test tests/runtime-scaling.test.mjs
      - name: Measure Rust and PHP scaling
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: npm run bench:runtime -- reports/runtime-ci.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmark
        with:
          name: runtime-measurements
          path: proofs/reports/runtime-ci.json*
          if-no-files-found: error

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: proofs/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - name: Restore node modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: proofs/node_modules
          key: proofs-node-modules-v1-${{ runner.os }}-${{ hashFiles('.nvmrc', 'proofs/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: pip install -r proofs/site/requirements.txt
        working-directory: .
      # charts.py redraws only charts whose data record changed. The drawing code and
      # matplotlib pin go in the prefix: they change a chart without changing its record.
      - name: Restore rendered charts
        uses: actions/cache@v4
        with:
          path: proofs/_site/charts
          key: proofs-charts-v1-${{ hashFiles('proofs/scripts/site/charts.py', 'proofs/site/requirements.txt') }}-${{ hashFiles('proofs/reports/**') }}
          restore-keys: proofs-charts-v1-${{ hashFiles('proofs/scripts/site/charts.py', 'proofs/site/requirements.txt') }}-
      - run: npm run build:site
      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('proofs/package-lock.json') }}
      # No --with-deps: the runner image already carries Chrome's system libraries, and apt cost 20s to 3 minutes.
      - run: npx playwright install chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: proofs-site-test-results
          path: proofs/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: proofs-site
          path: proofs/_site
          include-hidden-files: true
